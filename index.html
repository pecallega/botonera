<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Botonera al aire</title>
<link rel="icon" type="image/png" href="logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bungee&family=Outfit:wght@500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--logo:drop-shadow(0 6px 14px rgba(0,0,0,.55)) drop-shadow(0 0 18px rgba(232,35,42,.35));--bg:#0b0b0d;--ink:#f4f4f6;--mut:rgba(255,255,255,.55);--on:#e8232a;--glass:rgba(255,255,255,.055);--glass2:rgba(255,255,255,.1);--line:rgba(255,255,255,.1);--disp:"Outfit","Inter",system-ui,-apple-system,"Segoe UI",sans-serif;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px);color-scheme:dark}
body{margin:0;min-height:100vh;color:var(--ink);font-family:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:15px;padding:20px;background:radial-gradient(900px 500px at 50% -12%,rgba(232,35,42,.20),transparent 70%) fixed,#0b0b0d}
body::before{content:"";position:fixed;right:-4vmin;bottom:-4vmin;width:min(80vmin,720px);aspect-ratio:663/677;background:url(logo.png) center/contain no-repeat;opacity:.09;transform:rotate(-12deg);pointer-events:none;z-index:0}
header,#msg,#grid,#empty{position:relative;z-index:1}
header{display:flex;flex-wrap:wrap;gap:14px 18px;align-items:center;justify-content:space-between;margin-bottom:20px}
.brand{display:flex;align-items:center;gap:14px}
.logo{height:108px;width:auto;transform:rotate(-4deg);filter:var(--logo)}
.logo:hover{transform:rotate(4deg) scale(1.08)}
h1{display:flex;align-items:center;gap:10px;margin:0;font-family:"Bungee",var(--disp);font-weight:400;font-size:clamp(1.3rem,4.8vw,2rem);letter-spacing:.01em;text-transform:uppercase;line-height:1;text-shadow:0 3px 0 rgba(0,0,0,.45)}
h1 em{font-style:normal;color:var(--on)}
.lamp{width:9px;height:9px;border-radius:50%;background:rgba(255,255,255,.25);flex:none}
body.air .lamp,body.live .lamp{background:var(--on);box-shadow:0 0 12px 2px var(--on)}
.bar{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-start}
button,label.btn,select{font:inherit;font-weight:500;border:1px solid var(--line);background:var(--glass);color:var(--ink);padding:9px 14px;border-radius:12px;cursor:pointer;-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px)}
header button:hover,header label.btn:hover,select:hover{background:var(--glass2);border-color:rgba(255,255,255,.25)}
button:focus-visible,label.btn:focus-within,select:focus-visible{outline:2px solid var(--on);outline-offset:2px}
.stop{background:var(--on);border-color:transparent;color:#fff;font-weight:600}
header .stop:hover{background:#f0373d;border-color:transparent}
select option{background:#18181b;color:#fff}
.fx{display:grid;grid-template-columns:auto 150px 56px;gap:8px 10px;align-items:center;border:1px solid var(--line);border-radius:16px;padding:10px 12px;background:var(--glass);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px)}
.fx button,.fx .lbl{padding:6px 12px;min-width:84px;text-align:center}
.fx button.active{background:#fff;border-color:#fff;color:#0b0b0d}
.fx #mic.active{background:var(--on);border-color:var(--on);color:#fff}
.fx .lbl{color:var(--mut);font-weight:500;border:1px solid transparent}
.fx input[type=range]{width:100%;accent-color:var(--on);cursor:pointer}
.fx select{width:100%;padding:6px 8px;font-size:.85rem;text-overflow:ellipsis}
.fx .v{text-align:right;font-size:.85rem;color:var(--mut)}
.fx #mv{color:var(--on);font-weight:600;font-size:.7rem}
input[type=file]{position:absolute;opacity:0;width:1px;height:1px}
#grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.cell{position:relative}
.pad{position:relative;width:100%;height:100%;min-height:122px;text-align:left;display:flex;flex-direction:column;justify-content:space-between;gap:6px;padding:12px;touch-action:manipulation;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;background:var(--glass);border:1px solid var(--line);border-radius:18px;box-shadow:0 8px 24px rgba(0,0,0,.25)}
.pad .k{font-family:var(--disp);font-weight:600;font-size:.95rem;line-height:1;min-width:28px;height:28px;padding:0 6px;display:inline-flex;align-items:center;justify-content:center;border-radius:9px;background:rgba(255,255,255,.1);align-self:flex-start}
.pad .w{display:block;width:100%;height:26px;opacity:.5;pointer-events:none;fill:currentColor}
.pad .n{font-size:.9rem;font-weight:500;line-height:1.2;color:rgba(255,255,255,.88);overflow:hidden;overflow-wrap:anywhere;word-break:break-word;display:-webkit-box;-webkit-line-clamp:3;line-clamp:3;-webkit-box-orient:vertical;max-height:3.7em}
.pad:hover{background:var(--glass2);border-color:rgba(255,255,255,.28);transform:translateY(-2px)}
.pad:active{transform:scale(.98)}
.pad.col{background:var(--c2);border-color:var(--c)}
.pad.col .w{fill:var(--c);opacity:.9}
.pad.col .k{background:var(--c);color:var(--fg)}
.pad.col:hover{background:var(--c2);filter:brightness(1.25)}
.pad.on{background:rgba(232,35,42,.28);border-color:var(--on);box-shadow:0 0 0 1px var(--on),0 8px 32px rgba(232,35,42,.35)}
.pad.col.on{background:var(--c2);border-color:var(--c);box-shadow:0 0 0 1px var(--c),0 8px 32px var(--c2)}
.pad.on .w{opacity:.95}
.recpad{border:1px dashed rgba(255,255,255,.25);background:rgba(255,255,255,.02);box-shadow:none}
.recpad .rdot{width:28px;height:28px;border-radius:50%;background:var(--on);box-shadow:0 0 0 6px rgba(232,35,42,.2);align-self:flex-start;margin:0 0 0 0}
.recpad .t{font-size:.8rem;color:var(--mut);font-variant-numeric:tabular-nums}
.recpad.recording{border:1px solid var(--on);background:rgba(232,35,42,.14)}
.recpad.recording .rdot{border-radius:8px;width:24px;height:24px;margin:2px}
.recpad.recording .t{color:#fff}
#msg:empty{display:none}
#msg{color:var(--mut);margin:0 0 14px;max-width:70ch;line-height:1.4}
.gear{position:absolute;top:8px;right:8px;width:26px;height:26px;padding:0;border:0;border-radius:50%;background:rgba(255,255,255,.08);color:rgba(255,255,255,.75);font-size:15px;line-height:26px;text-align:center;z-index:2;-webkit-backdrop-filter:none;backdrop-filter:none}
.gear:hover{background:rgba(255,255,255,.2);color:#fff}
.so{display:none;position:absolute;left:50%;top:50%;width:42px;height:42px;margin:-21px 0 0 -21px;border-radius:50%;background:rgba(0,0,0,.45);border:1.5px solid rgba(255,255,255,.85);pointer-events:none;z-index:1;-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
.so::after{content:"";position:absolute;left:14px;top:14px;width:11px;height:11px;background:#fff;border-radius:2px}
.pad.on .so{display:block}
#empty{display:none;text-align:center;padding:10px 0 30px}
#empty img{width:min(60vw,300px);height:auto;filter:drop-shadow(0 10px 30px rgba(232,35,42,.35))}
#splash{position:fixed;inset:0;z-index:30;background:radial-gradient(600px 400px at 50% 40%,rgba(232,35,42,.28),transparent 70%),#0b0b0d;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;transition:opacity .5s}
#splash.off{opacity:0;pointer-events:none}
#splash .lg{width:min(58vw,320px);height:auto}
#splash .tx{font-family:"Bungee",var(--disp);font-size:.95rem;letter-spacing:.04em;text-transform:uppercase;color:var(--mut)}
#menu{position:fixed;top:0;right:0;bottom:0;width:min(380px,100%);background:rgba(18,18,22,.88);-webkit-backdrop-filter:blur(24px);backdrop-filter:blur(24px);border-left:1px solid var(--line);padding:calc(16px + env(safe-area-inset-top,0px)) 16px 16px;overflow-y:auto;display:none;z-index:5}
#menu.open{display:block}
#menu h2{font-family:var(--disp);font-weight:600;font-size:1.05rem;margin:0}
#menu .top{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
#menu p{color:var(--mut);font-size:.9rem;line-height:1.4;margin:0 0 12px}
.row{display:flex;gap:8px;align-items:center;margin-bottom:6px;padding:5px 6px;border-radius:12px}
.row:hover{background:var(--glass2)}
.row .nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:500}
.row .key{min-width:84px}
.row .key.wait{border-color:var(--on);color:var(--on)}
.row .del{padding:9px 12px;color:var(--mut)}
.mlogo{display:block;width:120px;height:auto;margin:26px auto 4px;opacity:.85}
#cm{position:fixed;display:none;z-index:10;background:rgba(24,24,28,.92);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);border:1px solid var(--line);border-radius:16px;padding:10px;box-shadow:0 12px 40px rgba(0,0,0,.6);width:208px}
#cm .sw{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-bottom:8px}
#cm .sw button{width:100%;aspect-ratio:1;padding:0;border-radius:50%;border:2px solid rgba(255,255,255,.15)}
#cm .ft{display:flex;gap:6px;align-items:center}
#cm .ft button{padding:6px 8px;font-size:.85rem;flex:1}
#cm input[type=color]{width:38px;height:32px;padding:0;border:1px solid var(--line);border-radius:10px;background:none;cursor:pointer}
@media (prefers-reduced-motion:no-preference){
.pad,.logo{transition:transform .15s,background .15s,border-color .15s,box-shadow .2s}
body.air .logo{animation:beat .6s ease-in-out infinite}
.pad.on{animation:glow 1.2s ease-in-out infinite}
.recpad.recording .rdot{animation:glow2 1s ease-in-out infinite}
#splash .lg{animation:pop .7s cubic-bezier(.2,1.4,.4,1)}
#empty img{animation:float 3s ease-in-out infinite}
@keyframes beat{0%,100%{transform:rotate(-4deg) scale(1);filter:var(--logo)}50%{transform:rotate(3deg) scale(1.13);filter:drop-shadow(0 6px 14px rgba(0,0,0,.55)) drop-shadow(0 0 28px rgba(232,35,42,.95))}}
@keyframes glow{50%{box-shadow:0 0 0 1px var(--on),0 8px 44px rgba(232,35,42,.55)}}
@keyframes glow2{50%{box-shadow:0 0 0 10px rgba(232,35,42,.1)}}
@keyframes pop{from{transform:scale(.4);opacity:0}}
@keyframes float{50%{transform:translateY(-6px)}}
}
</style>
</head>
<body>
<div id="splash"><img class="lg" src="logo.png" alt="" onerror="this.parentNode.style.display='none'"><div class="tx">Cargando audios…</div></div>
<header>
  <div class="brand"><img class="logo" src="logo.png" alt="" onerror="this.style.display='none'"><h1><span class="lamp" aria-hidden="true"></span>Botonera <em>al aire</em></h1></div>
  <div class="bar">
    <label class="btn">Cargar audios<input id="file" type="file" accept="audio/*" multiple></label>
    <div class="fx" title="Delay: 80 a 150 ms = slapback rockabilly. Los rebotes van de lado a lado.">
      <button id="dly" aria-pressed="false">Delay</button>
      <input id="dms" type="range" min="0" max="800" step="5" value="120" aria-label="Tiempo del delay en milisegundos">
      <span id="dval" class="v">120 ms</span>
      <span class="lbl">Reverb</span>
      <input id="rev" type="range" min="0" max="100" step="1" value="0" aria-label="Cantidad de reverb">
      <span id="rval" class="v">0%</span>
      <button id="mic" aria-pressed="false" title="Escucha la entrada de la placa con delay y reverb. Usá auriculares para evitar el acople.">Mic en vivo</button>
      <select id="indev" aria-label="Entrada de audio"><option value="">Entrada predeterminada</option></select>
      <span id="mv" class="v"></span>
    </div>
    <button id="stop" class="stop">Parar todo</button>
    <button id="burger" aria-label="Configurar teclas" title="Configurar teclas">☰</button>
  </div>
</header>
<p id="msg"></p>
<div id="empty"><img src="logo.png" alt="Botonera al aire" onerror="this.style.display='none'"></div>
<div id="grid"></div>

<aside id="menu" aria-label="Configurar teclas">
  <div class="top"><h2>Teclas de cada audio</h2><button id="close" aria-label="Cerrar">✕</button></div>
  <p>Tocá "Cambiar", después apretá la letra o número que quieras. Backspace deja el botón sin tecla. Esc cancela.</p>
  <div id="list"></div>
  <img class="mlogo" src="logo.png" alt="" onerror="this.style.display='none'">
</aside>

<div id="cm" role="menu" aria-label="Color del botón">
  <div class="sw" id="sw"></div>
  <div class="ft"><input type="color" id="cpick" title="Color personalizado"><button id="creset">Sin color</button></div>
</div>

<script>
// Audios extra opcionales (nombres de archivos dentro de la carpeta "audios").
// Si el sitio está en GitHub Pages, la carpeta se lee sola: no hace falta listar nada acá.
const BASE=[];

const KEYS="1234567890QWERTYUIOPASDFGHJKLZXCVBNM".split("");
const PALETTE=["#e8232a","#a3141a","#ff5a36","#f2c230","#4a90f2","#3a3a3a","#6b6b6b","#9a9a9a","#c4c4c4","#ffffff"];
const AC=window.AudioContext||window.webkitAudioContext;
const ctx=new AC({latencyHint:"interactive"});
let items=[],colors={},waiting=null,cmIdx=null;
const $=id=>document.getElementById(id);
const grid=$("grid"),msg=$("msg"),menu=$("menu"),list=$("list"),cm=$("cm");
const nice=n=>n.replace(/\.[^.]+$/,"");

/* ---------- efectos: delay estéreo (ping-pong) + reverb ---------- */
const dry=ctx.createGain(),dlyIn=ctx.createGain(),wet=ctx.createGain(),revSend=ctx.createGain(),reverb=ctx.createConvolver();
dlyIn.channelCount=1;dlyIn.channelCountMode="explicit"; // el delay recibe mono para poder mandar cada rebote a un lado
const dL=ctx.createDelay(1),dR=ctx.createDelay(1);
const lp=()=>{const f=ctx.createBiquadFilter();f.type="lowpass";f.frequency.value=3200;return f};
const gn=v=>{const g=ctx.createGain();g.gain.value=v;return g};
const pan=v=>{if(ctx.createStereoPanner){const p=ctx.createStereoPanner();p.pan.value=v;return p}return ctx.createGain()};
const pL=pan(-1),pR=pan(1),l1=lp(),l2=lp(),f1=gn(.5),f2=gn(.5); // .5 = cada rebote suena a la mitad y se va apagando
dlyIn.connect(dL);dL.connect(pL);pL.connect(wet);
dL.connect(l1);l1.connect(f1);f1.connect(dR);dR.connect(pR);pR.connect(wet);
dR.connect(l2);l2.connect(f2);f2.connect(dL);
wet.gain.value=0;wet.connect(ctx.destination);dry.connect(ctx.destination);
(function(){const len=Math.floor(ctx.sampleRate*2.2),b=ctx.createBuffer(2,len,ctx.sampleRate);
  for(let c=0;c<2;c++){const d=b.getChannelData(c);let y=0;for(let i=0;i<len;i++){y+=((Math.random()*2-1)-y)*.45;d[i]=y*Math.pow(1-i/len,2.8)}}
  reverb.buffer=b})();
revSend.gain.value=0;revSend.connect(reverb);reverb.connect(ctx.destination);
let fx={on:false,ms:120,rev:0};
try{const f=JSON.parse(localStorage.getItem("botonera_fx")||"null");if(f&&typeof f.ms==="number")fx={on:!!f.on,ms:Math.min(800,Math.max(0,f.ms)),rev:Math.min(100,Math.max(0,+f.rev||0))}}catch(e){}
function applyFx(){
  const t=ctx.currentTime;
  wet.gain.setTargetAtTime(fx.on?0.65:0,t,.01);
  dL.delayTime.setTargetAtTime(fx.ms/1000,t,.02);dR.delayTime.setTargetAtTime(fx.ms/1000,t,.02);
  revSend.gain.setTargetAtTime(fx.rev/100*0.9,t,.02);
  $("dly").classList.toggle("active",fx.on);$("dly").setAttribute("aria-pressed",fx.on);
  $("dms").value=fx.ms;$("dval").textContent=fx.ms+" ms";
  $("rev").value=fx.rev;$("rval").textContent=fx.rev+"%";
  try{localStorage.setItem("botonera_fx",JSON.stringify(fx))}catch(e){}
}
$("dly").addEventListener("click",()=>{fx.on=!fx.on;applyFx()});
$("dms").addEventListener("input",e=>{fx.ms=+e.target.value;applyFx()});
$("rev").addEventListener("input",e=>{fx.rev=+e.target.value;applyFx()});
applyFx();

/* ---------- entrada de la placa: en vivo + grabar ---------- */
const mic={stream:null,src:null,live:false,rec:null,dev:""};
try{mic.dev=localStorage.getItem("botonera_dev")||""}catch(e){}
const MICFAIL="No pude acceder a la entrada de audio. Revisá el permiso del micrófono en la barra del navegador.",HEAD="Usá auriculares para evitar el acople (silbido).";
async function openMic(){
  if(mic.stream)return mic.stream;
  const a={echoCancellation:false,noiseSuppression:false,autoGainControl:false};
  try{mic.stream=await navigator.mediaDevices.getUserMedia({audio:mic.dev?Object.assign({deviceId:{exact:mic.dev}},a):a})}
  catch(e){if(!mic.dev)throw e;mic.dev="";mic.stream=await navigator.mediaDevices.getUserMedia({audio:a})}
  fillDevs();return mic.stream;
}
async function fillDevs(){try{
  const l=(await navigator.mediaDevices.enumerateDevices()).filter(d=>d.kind==="audioinput"),sel=$("indev");sel.innerHTML="";
  l.forEach((d,i)=>{const o=document.createElement("option");o.value=d.deviceId;o.textContent=d.label||("Entrada "+(i+1));sel.appendChild(o)});
  const t=mic.stream&&mic.stream.getAudioTracks()[0],cur=t&&t.getSettings().deviceId;if(cur)sel.value=cur}catch(e){}}
function routeLive(){
  if(mic.src){try{mic.src.disconnect()}catch(e){}mic.src=null}
  if(mic.live&&mic.stream){mic.src=ctx.createMediaStreamSource(mic.stream);mic.src.connect(dry);mic.src.connect(dlyIn);mic.src.connect(revSend)}
}
function closeMicIfIdle(){if(!mic.live&&!mic.rec&&mic.stream){mic.stream.getTracks().forEach(t=>t.stop());mic.stream=null}}
function liveUI(){$("mic").classList.toggle("active",mic.live);$("mic").setAttribute("aria-pressed",mic.live);$("mv").textContent=mic.live?"EN VIVO":"";document.body.classList.toggle("live",mic.live)}
$("mic").addEventListener("click",async()=>{
  if(mic.live){mic.live=false;routeLive();closeMicIfIdle();liveUI();if(msg.textContent===HEAD)msg.textContent="";return}
  try{if(ctx.state!=="running")ctx.resume();await openMic();mic.live=true;routeLive();liveUI();msg.textContent=HEAD}
  catch(e){msg.textContent=MICFAIL}
});
$("indev").addEventListener("change",async e=>{
  mic.dev=e.target.value;try{localStorage.setItem("botonera_dev",mic.dev)}catch(x){}
  if(mic.rec||!mic.stream)return;
  mic.stream.getTracks().forEach(t=>t.stop());mic.stream=null;
  if(mic.live){try{await openMic();routeLive()}catch(x){mic.live=false;liveUI();msg.textContent=MICFAIL}}
});
function recCell(){
  const c=document.createElement("div");c.className="cell";
  const b=document.createElement("button");b.id="recpad";b.className="pad recpad"+(mic.rec?" recording":"");
  b.title=mic.rec?"Detener y crear el botón":"Grabar desde la entrada de audio";
  b.innerHTML='<span class="rdot"></span><span><span class="n"></span><span class="t"></span></span>';
  b.querySelector(".n").textContent=mic.rec?"Grabando…":"Grabar";
  b.querySelector(".t").textContent=mic.rec?"tocá para parar · 0:00":"tocá para crear un botón nuevo";
  b.querySelector(".n").style.display="block";
  b.addEventListener("pointerdown",e=>{if(e.button!==0)return;e.preventDefault();hideCm();recToggle()});
  b.addEventListener("keydown",e=>{if(e.key===" "||e.key==="Enter")e.preventDefault()});
  c.appendChild(b);return c;
}
function tick(){const t=document.querySelector("#recpad .t");if(t&&mic.rec){const s=Math.floor((Date.now()-mic.rec.t0)/1000);t.textContent="tocá para parar · "+Math.floor(s/60)+":"+String(s%60).padStart(2,"0")}}
async function recToggle(){
  if(mic.rec){mic.rec.mr.stop();return}
  if(!window.MediaRecorder){msg.textContent="Este navegador no permite grabar. Probá con Chrome, Brave, Edge o Firefox.";return}
  try{
    if(ctx.state!=="running")ctx.resume();
    const st=await openMic(),chunks=[],mr=new MediaRecorder(st);
    mic.rec={mr,t0:Date.now(),timer:setInterval(tick,250)};
    mr.ondataavailable=e=>{if(e.data&&e.data.size)chunks.push(e.data)};
    mr.onstop=async()=>{
      clearInterval(mic.rec.timer);mic.rec=null;closeMicIfIdle();
      const type=mr.mimeType||"audio/webm",ext=/mp4/.test(type)?"m4a":/ogg/.test(type)?"ogg":"webm",d=new Date(),z=n=>String(n).padStart(2,"0");
      await add("Grabación "+z(d.getHours())+"."+z(d.getMinutes())+"."+z(d.getSeconds())+"."+ext,new Blob(chunks,{type}));
      render();save();
    };
    mr.start();render();
  }catch(e){mic.rec=null;msg.textContent=MICFAIL}
}

/* ---------- almacenamiento (IndexedDB) ---------- */
function db(){return new Promise((ok,no)=>{try{const r=indexedDB.open("botonera",1);
  r.onupgradeneeded=()=>r.result.createObjectStore("s");
  r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)}catch(e){no(e)}})}
async function save(){try{const d=await db();const keys={};items.forEach(i=>keys[i.name]=i.key);
  d.transaction("s","readwrite").objectStore("s").put({own:items.filter(i=>!i.base).map(i=>({name:i.name,blob:i.blob,key:i.key})),keys,colors},"items")}catch(e){console.warn("No se pudo guardar",e)}}
async function load(){try{const d=await db();return await new Promise(ok=>{
  const q=d.transaction("s").objectStore("s").get("items");q.onsuccess=()=>ok(q.result||{});q.onerror=()=>ok({})})}catch(e){return {}}}

/* ---------- audio ---------- */
function decode(ab){return new Promise((ok,no)=>{const p=ctx.decodeAudioData(ab,ok,no);if(p&&p.catch)p.catch(no)})}
function peaks(buf,n){const d=buf.getChannelData(0),size=Math.floor(d.length/n)||1,out=[];let mx=0;
  for(let i=0;i<n;i++){let m=0;for(let j=i*size;j<(i+1)*size&&j<d.length;j+=Math.ceil(size/200)){const v=Math.abs(d[j]);if(v>m)m=v}out.push(m);if(m>mx)mx=m}
  return out.map(v=>mx?v/mx:0)}
function waveSVG(p){let r="";p.forEach((v,i)=>{const h=Math.max(1.5,v*22);r+='<rect x="'+i+'" y="'+(12-h/2).toFixed(1)+'" width=".7" height="'+h.toFixed(1)+'"/>'});
  return '<svg class="w" viewBox="0 0 '+p.length+' 24" preserveAspectRatio="none" aria-hidden="true">'+r+'</svg>'}
function freeKey(){return KEYS.find(k=>!items.some(i=>i.key===k))||""}
async function add(name,blob,key,base){
  if(items.some(i=>i.name===name))return;
  try{
    const buffer=await decode(await blob.arrayBuffer());
    items.push({name,blob,buffer,peaks:peaks(buffer,48),key:key===undefined?freeKey():key,base:!!base,playing:new Set()});
  }catch(e){msg.textContent="No pude leer \""+name+"\". Probá con MP3 o WAV."}
}
function play(idx){
  const it=items[idx];if(!it)return;
  if(ctx.state!=="running")ctx.resume();
  const s=ctx.createBufferSource();s.buffer=it.buffer;s.connect(dry);s.connect(dlyIn);s.connect(revSend);
  it.playing.add(s);mark(idx);
  s.onended=()=>{it.playing.delete(s);mark(items.indexOf(it))};
  s.start(0);
}
// Primer toque: suena. Segundo toque: se detiene. Los demás botones siguen sonando (multiplay).
function toggle(idx){const it=items[idx];if(!it)return;
  if(it.playing.size){it.playing.forEach(s=>{try{s.stop()}catch(e){}});return}
  play(idx)}
function stopAll(){items.forEach(i=>i.playing.forEach(s=>{try{s.stop()}catch(e){}}))}
function stopFirst(){const i=items.find(i=>i.playing.size);if(i)i.playing.forEach(s=>{try{s.stop()}catch(e){}})}

/* ---------- interfaz ---------- */
function tint(h,a){const n=parseInt(h.slice(1),16);return"rgba("+(n>>16)+","+(n>>8&255)+","+(n&255)+","+a+")"}
function fg(h){const n=parseInt(h.slice(1),16),r=n>>16,g=n>>8&255,b=n&255;return(r*299+g*587+b*114)/1000>150?"#111":"#fff"}
function render(){
  grid.innerHTML="";
  items.forEach((it,idx)=>{
    const cell=document.createElement("div");cell.className="cell";
    const b=document.createElement("button");
    b.className="pad";b.id="p"+idx;b.title=nice(it.name);
    b.innerHTML='<span class="k"></span>'+waveSVG(it.peaks)+'<span class="n"></span><span class="so"></span>';
    const g=document.createElement("button");
    g.className="gear";g.textContent="\u2699\uFE0E";g.title="Cambiar color";g.setAttribute("aria-label","Cambiar color de "+nice(it.name));
    g.addEventListener("click",e=>{e.stopPropagation();if(cm.style.display==="block"&&cmIdx===idx){hideCm();return}const r=g.getBoundingClientRect();openCm(r.left,r.bottom+4,idx)});
    b.querySelector(".k").textContent=it.key||"–";
    b.querySelector(".n").textContent=nice(it.name);
    const c=colors[it.name];
    if(c){b.classList.add("col");b.style.setProperty("--c",c);b.style.setProperty("--c2",tint(c,.2));b.style.setProperty("--fg",fg(c))}
    b.addEventListener("pointerdown",e=>{if(e.button!==0)return;e.preventDefault();hideCm();toggle(idx)});
    b.addEventListener("contextmenu",e=>{e.preventDefault();openCm(e.clientX,e.clientY,idx)});
    b.addEventListener("keydown",e=>{if(e.key===" "||e.key==="Enter")e.preventDefault()});
    cell.appendChild(b);cell.appendChild(g);grid.appendChild(cell);mark(idx);
  });
  grid.appendChild(recCell());
  renderMenu();
  $("empty").style.display=items.length?"none":"block";
}
function renderMenu(){
  list.innerHTML="";
  items.forEach((it,idx)=>{
    const r=document.createElement("div");r.className="row";
    r.innerHTML='<span class="nm"></span><button class="key"></button><button class="del" title="Quitar audio">🗑</button>';
    r.querySelector(".nm").textContent=nice(it.name);
    const kb=r.querySelector(".key");
    kb.textContent=waiting===idx?"Apretá una tecla…":(it.key?it.key+" · Cambiar":"Asignar");
    if(waiting===idx)kb.classList.add("wait");
    kb.addEventListener("click",()=>{waiting=waiting===idx?null:idx;renderMenu()});
    if(it.base)r.querySelector(".del").remove();
    else r.querySelector(".del").addEventListener("click",()=>remove(idx));
    list.appendChild(r);
  });
  if(!items.length)list.innerHTML="<p>Todavía no cargaste audios.</p>";
}
function mark(idx){const el=$("p"+idx);if(el&&items[idx])el.classList.toggle("on",items[idx].playing.size>0);document.body.classList.toggle("air",items.some(i=>i.playing.size>0))}
function remove(idx){items[idx].playing.forEach(s=>{try{s.stop()}catch(e){}});
  delete colors[items[idx].name];items.splice(idx,1);waiting=null;render();save()}
function assign(idx,k){
  const o=items.findIndex((i,n)=>n!==idx&&i.key===k);
  if(o>=0)items[o].key=items[idx].key;
  items[idx].key=k;waiting=null;render();save();
}

/* ---------- menú de color (clic derecho) ---------- */
PALETTE.forEach(c=>{const b=document.createElement("button");b.style.background=c;b.title=c;b.setAttribute("aria-label","Color "+c);
  b.addEventListener("click",()=>setColor(c));$("sw").appendChild(b)});
function openCm(x,y,idx){cmIdx=idx;cm.style.display="block";
  const w=cm.offsetWidth,h=cm.offsetHeight;
  cm.style.left=Math.max(4,Math.min(x,innerWidth-w-8))+"px";cm.style.top=Math.max(4,Math.min(y,innerHeight-h-8))+"px";
  $("cpick").value=colors[items[idx].name]||"#2f80ed"}
function hideCm(){cm.style.display="none";cmIdx=null}
function setColor(c){if(cmIdx===null)return;const n=items[cmIdx].name;if(c)colors[n]=c;else delete colors[n];hideCm();render();save()}
$("cpick").addEventListener("change",e=>setColor(e.target.value));
$("creset").addEventListener("click",()=>setColor(null));
document.addEventListener("pointerdown",e=>{
  const t=e.target;
  if(cm.style.display==="block"&&!cm.contains(t)&&!(t.closest&&t.closest(".gear")))hideCm();
  if(menu.classList.contains("open")&&!menu.contains(t)&&!(t.closest&&t.closest("#burger"))){menu.classList.remove("open");waiting=null;renderMenu()}
},true);
window.addEventListener("scroll",hideCm,true);window.addEventListener("resize",hideCm);

/* ---------- eventos ---------- */
$("file").addEventListener("change",async e=>{
  for(const f of e.target.files)await add(f.name,f);
  e.target.value="";render();save();
  if(items.length&&msg.textContent.indexOf("Cargá")===0)msg.textContent="";
});
$("stop").addEventListener("click",stopAll);
$("burger").addEventListener("click",()=>{menu.classList.toggle("open");waiting=null;renderMenu()});
$("close").addEventListener("click",()=>{menu.classList.remove("open");waiting=null;renderMenu()});
document.addEventListener("keydown",e=>{
  if(e.ctrlKey||e.metaKey||e.altKey)return;
  if(waiting!==null){
    e.preventDefault();
    if(e.key==="Escape"){waiting=null;renderMenu();return}
    if(e.key==="Backspace"||e.key==="Delete"){items[waiting].key="";waiting=null;render();save();return}
    if(e.key.length===1&&KEYS.includes(e.key.toUpperCase()))assign(waiting,e.key.toUpperCase());
    return;
  }
  if(e.repeat)return;
  if(e.key==="Escape"){hideCm();stopFirst();return}
  const idx=items.findIndex(i=>i.key&&i.key===e.key.toUpperCase());
  if(idx>=0){e.preventDefault();toggle(idx)}
});

/* ---------- arranque ---------- */
// Lee la carpeta "audios" del repositorio (solo funciona en GitHub Pages; si falla, se ignora sin mostrar error).
async function repoList(){
  try{
    const h=location.hostname;if(!/\.github\.io$/.test(h))return [];
    const u=h.split(".")[0];let r=location.pathname.split("/")[1]||"";if(!r||r.indexOf(".")>-1)r=h;
    const res=await fetch("https://api.github.com/repos/"+u+"/"+r+"/contents/audios");
    if(!res.ok)return [];
    return(await res.json()).filter(f=>f.type==="file"&&/\.(mp3|wav|ogg|m4a|aac|flac|opus)$/i.test(f.name)).map(f=>f.name);
  }catch(e){return []}
}
setTimeout(()=>$("splash").classList.add("off"),8000);
$("splash").addEventListener("click",()=>$("splash").classList.add("off"));
(async()=>{
  try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist()}catch(e){}
  const saved=await load();
  const own=saved.own||[],keys=saved.keys||{};colors=saved.colors||{};
  const names=Array.from(new Set(BASE.concat(await repoList())));
  for(const n of names){
    try{
      const r=await fetch("audios/"+encodeURIComponent(n));if(!r.ok)throw new Error(r.status);
      await add(n,await r.blob(),keys[n]===undefined?null:keys[n],true);
    }catch(e){console.warn("Se omitió",n)}
  }
  for(const s of own)await add(s.name,s.blob,s.key);
  items.forEach(i=>{if(i.key===null)i.key=freeKey()});
  render();
  const sp=$("splash");setTimeout(()=>sp.classList.add("off"),Math.max(0,1000-performance.now()));
  if(!items.length&&!msg.textContent)msg.textContent="Cargá tus audios (MP3, WAV, OGG) con el botón de arriba.";
})();
</script>
